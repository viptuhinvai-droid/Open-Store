<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN STORE</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9198a3;
    --accent: #4f8cff;
    --green: #3ecf8e;
    --yellow: #e0b13d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  header h1 { margin: 0 0 12px 0; font-size: 22px; }
  header input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
  }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .grid { display: grid; gap: 12px; }
  .app-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
  }
  .app-icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: linear-gradient(135deg, #2a2e37, #3a3f4b);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: var(--muted);
    flex-shrink: 0; overflow: hidden;
  }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .app-info { flex: 1; min-width: 0; }
  .app-info h3 { margin: 0 0 3px 0; font-size: 16px; }
  .app-info p { margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .badge.authorized { background: rgba(62,207,142,.15); color: var(--green); }
  .badge.pending { background: rgba(224,177,61,.15); color: var(--yellow); }
  .empty, .loading { text-align: center; color: var(--muted); padding: 60px 20px; }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 20; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); border-radius: 18px 18px 0 0;
    padding: 20px; width: 100%; max-width: 720px; max-height: 85vh; overflow-y: auto;
  }
  .sheet .app-icon { width: 64px; height: 64px; font-size: 26px; margin-bottom: 12px; }
  .sheet h2 { margin: 0 0 4px 0; }
  .sheet .dev { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .sheet .desc { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 18px; white-space: pre-wrap; }
  .notice {
    font-size: 13px; padding: 12px 14px; border-radius: 10px;
    background: rgba(224,177,61,.12); color: var(--yellow); margin-bottom: 14px;
  }
  .download-btn {
    display: block; width: 100%; text-align: center; padding: 14px;
    background: var(--accent); color: #fff; border-radius: 12px;
    text-decoration: none; font-weight: 600; font-size: 15px; border: none;
  }
  .close-btn {
    display: block; width: 100%; text-align: center; padding: 12px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 12px; margin-top: 10px; font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>OPEN STORE</h1>
  <input id="search" type="text" placeholder="অ্যাপ খুঁজুন...">
</header>

<main>
  <div id="content" class="loading">লোড হচ্ছে...</div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const API_BASE = "https://open-store-api.onrender.com";
let allApps = [];

function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}

function renderList(apps) {
  const content = document.getElementById("content");
  if (apps.length === 0) {
    content.innerHTML = '<div class="empty">কোনো অ্যাপ পাওয়া যায়নি</div>';
    return;
  }
  content.className = "grid";
  content.innerHTML = apps.map(app => {
    const authorized = app.stage === "AUTHORIZED" && app.binary_hosted;
    const badge = authorized
      ? '<span class="badge authorized">Available</span>'
      : '<span class="badge pending">Pending</span>';
    const icon = app.icon_url
      ? `<img src="${app.icon_url}" alt="">`
      : initials(app.app_name);
    return `
      <div class="app-card" onclick="openApp('${app.id}')">
        <div class="app-icon">${icon}</div>
        <div class="app-info">
          <h3>${escapeHtml(app.app_name)}</h3>
          <p>${escapeHtml(app.developer_name || "Unknown developer")}</p>
        </div>
        ${badge}
      </div>`;
  }).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

async function loadApps() {
  try {
    const res = await fetch(`${API_BASE}/apps?limit=100`);
    allApps = await res.json();
    renderList(allApps);
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<div class="empty">সার্ভারের সাথে সংযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।</div>';
  }
}

async function openApp(id) {
  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = '<div class="loading">লোড হচ্ছে...</div>';
  overlay.classList.add("show");

  try {
    const [appRes, noticeRes] = await Promise.all([
      fetch(`${API_BASE}/apps/${id}`),
      fetch(`${API_BASE}/apps/${id}/notice`)
    ]);
    const app = await appRes.json();
    const notice = await noticeRes.json();
    const authorized = app.stage === "AUTHORIZED" && app.binary_hosted;
    const icon = app.icon_url
      ? `<img src="${app.icon_url}" alt="">`
      : initials(app.app_name);

    sheet.innerHTML = `
      <div class="app-icon">${icon}</div>
      <h2>${escapeHtml(app.app_name)}</h2>
      <div class="dev">${escapeHtml(app.developer_name || "Unknown developer")}</div>
      <div class="desc">${escapeHtml(app.description || "কোনো বর্ণনা নেই।")}</div>
      ${authorized
        ? `<a class="download-btn" href="${app.binary_url}">Download</a>`
        : `<div class="notice">${escapeHtml(notice.notice)}</div>`
      }
      <button class="close-btn" onclick="closeApp()">বন্ধ করুন</button>
    `;
  } catch (e) {
    sheet.innerHTML = '<div class="empty">লোড করা যায়নি।</div><button class="close-btn" onclick="closeApp()">বন্ধ করুন</button>';
  }
}

function closeApp() {
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeApp();
});

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderList(allApps); return; }
  const filtered = allApps.filter(app =>
    (app.app_name || "").toLowerCase().includes(q) ||
    (app.developer_name || "").toLowerCase().includes(q)
  );
  renderList(filtered);
});

loadApps();
</script>

</body>
</html>
