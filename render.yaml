# Render "Blueprint" — lets Render create the web service AND the
# database automatically from this one file. In the Render dashboard:
# New -> Blueprint -> connect this GitHub repo -> it reads this file.
databases:
  - name: open-store-db
    plan: free

services:
  - type: web
    name: open-store-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-store-db
          property: connectionString
