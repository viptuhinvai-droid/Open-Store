<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN STORE — Admin</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --border: #2a2e37;
    --text: #e8e9ec; --muted: #9198a3; --accent: #4f8cff;
    --green: #3ecf8e; --yellow: #e0b13d; --red: #e05c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  #login-box { max-width: 340px; margin: 80px auto; text-align: center; }
  #login-box input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 10px;
  }
  #login-box button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
  }
  #login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 13px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 2px 0; font-size: 16px; }
  .card .dev { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .stage-badge {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
    margin-bottom: 10px;
  }
  .stage-DISCOVERED { background: rgba(145,152,163,.15); color: var(--muted); }
  .stage-CONTACTED { background: rgba(79,140,255,.15); color: var(--accent); }
  .stage-VERIFIED { background: rgba(224,177,61,.15); color: var(--yellow); }
  .stage-AUTHORIZED { background: rgba(62,207,142,.15); color: var(--green); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: #22262f; color: var(--text); font-size: 13px;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { background: rgba(224,92,92,.12); color: var(--red); border-color: rgba(224,92,92,.3); }
  .btn:disabled { opacity: .5; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 20; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; }
  .modal h3 { margin-top: 0; }
  .modal input, .modal textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #0f1115; color: var(--text); font-size: 14px; margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="login-box">
  <h1 style="text-align:center;">OPEN STORE Admin</h1>
  <input id="admin-key-input" type="password" placeholder="Admin key">
  <button onclick="login()">লগইন</button>
  <div id="login-error"></div>
</div>

<div id="app-view" style="display:none;">
  <header><h1>OPEN STORE Admin</h1></header>
  <main>
    <div class="tabs">
      <div class="tab active" data-stage="" onclick="setFilter('', this)">সব</div>
      <div class="tab" data-stage="DISCOVERED" onclick="setFilter('DISCOVERED', this)">Discovered</div>
      <div class="tab" data-stage="CONTACTED" onclick="setFilter('CONTACTED', this)">Contacted</div>
      <div class="tab" data-stage="VERIFIED" onclick="setFilter('VERIFIED', this)">Verified</div>
      <div class="tab" data-stage="AUTHORIZED" onclick="setFilter('AUTHORIZED', this)">Authorized</div>
    </div>
    <div id="list" class="empty">লোড হচ্ছে...</div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const API_BASE = "https://open-store-api.onrender.com";
let adminKey = "";
let allApps = [];
let currentFilter = "";

function login() {
  const key = document.getElementById("admin-key-input").value.trim();
  if (!key) return;
  adminKey = key;
  document.getElementById("login-box").style.display = "none";
  document.getElementById("app-view").style.display = "block";
  loadApps();
}

function setFilter(stage, el) {
  currentFilter = stage;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  render();
}

async function loadApps() {
  try {
    const res = await fetch(`${API_BASE}/apps?limit=100`);
    allApps = await res.json();
    render();
  } catch (e) {
    document.getElementById("list").innerHTML = '<div class="empty">সার্ভারে সংযোগ করা যায়নি।</div>';
  }
}

function render() {
  const list = document.getElementById("list");
  const apps = currentFilter ? allApps.filter(a => a.stage === currentFilter) : allApps;
  if (apps.length === 0) {
    list.className = "empty";
    list.innerHTML = "কোনো অ্যাপ নেই।";
    return;
  }
  list.className = "";
  list.innerHTML = apps.map(app => `
    <div class="card">
      <h3>${escapeHtml(app.app_name)}</h3>
      <div class="dev">${escapeHtml(app.developer_name || "Unknown")} · ${escapeHtml(app.developer_contact_email || "no email")}</div>
      <span class="stage-badge stage-${app.stage}">${app.stage} — ${escapeHtml(app.contact_status)}</span>
      <div class="row">
        ${app.stage === "DISCOVERED" ? `<button class="btn primary" onclick="attemptContact('${app.id}')">Contact পাঠান</button>` : ""}
        ${(app.stage === "CONTACTED" || app.stage === "DISCOVERED") ? `<button class="btn" onclick="openVerifyModal('${app.id}')">Verify</button>` : ""}
        ${app.stage === "VERIFIED" ? `<button class="btn primary" onclick="authorize('${app.id}')">Authorize</button>` : ""}
        ${app.stage === "AUTHORIZED" && !app.binary_hosted ? `<button class="btn" onclick="openHostModal('${app.id}')">APK link যোগ করুন</button>` : ""}
        ${app.stage !== "AUTHORIZED" ? `<button class="btn danger" onclick="openRejectModal('${app.id}')">Not Authorized</button>` : ""}
      </div>
    </div>
  `).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
    body: body ? JSON.stringify(body) : ""
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || `Error ${res.status}`);
  }
  return res.json();
}

async function attemptContact(id) {
  try {
    await fetch(`${API_BASE}/apps/${id}/contact`, { method: "POST" });
    await loadApps();
  } catch (e) { alert("ব্যর্থ হয়েছে: " + e.message); }
}

async function authorize(id) {
  try {
    await apiPost(`/apps/${id}/authorize`, { authorized_by: "admin" });
    await loadApps();
  } catch (e) { alert("ব্যর্থ হয়েছে: " + e.message); }
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("show");
}

function openVerifyModal(id) {
  document.getElementById("modal-content").innerHTML = `
    <h3>Rights Verify করুন</h3>
    <textarea id="evidence" placeholder="প্রমাণ/নোট (যেমন: Play Store listing চেক করা হয়েছে)"></textarea>
    <div class="row">
      <button class="btn primary" onclick="submitVerify('${id}')">Verify করুন</button>
      <button class="btn" onclick="closeModal()">বাতিল</button>
    </div>
  `;
  document.getElementById("modal-overlay").classList.add("show");
}

async function submitVerify(id) {
  const evidence = document.getElementById("evidence").value.trim();
  if (!evidence) { alert("প্রমাণ/নোট লিখুন।"); return; }
  try {
    await apiPost(`/apps/${id}/verify`, { verified_by: "admin", evidence });
    closeModal();
    await loadApps();
  } catch (e) { alert("ব্যর্থ হয়েছে: " + e.message); }
}

function openRejectModal(id) {
  document.getElementById("modal-content").innerHTML = `
    <h3>Not Authorized করুন</h3>
    <textarea id="reason" placeholder="কারণ লিখুন"></textarea>
    <div class="row">
      <button class="btn danger" onclick="submitReject('${id}')">Not Authorized</button>
      <button class="btn" onclick="closeModal()">বাতিল</button>
    </div>
  `;
  document.getElementById("modal-overlay").classList.add("show");
}

async function submitReject(id) {
  const reason = document.getElementById("reason").value.trim();
  if (!reason) { alert("কারণ লিখুন।"); return; }
  try {
    await apiPost(`/apps/${id}/not-authorized`, { reason });
    closeModal();
    await loadApps();
  } catch (e) { alert("ব্যর্থ হয়েছে: " + e.message); }
}

function openHostModal(id) {
  document.getElementById("modal-content").innerHTML = `
    <h3>APK/AAB লিংক যোগ করুন</h3>
    <input id="binary-url" placeholder="https://...">
    <div class="row">
      <button class="btn primary" onclick="submitHost('${id}')">যোগ করুন</button>
      <button class="btn" onclick="closeModal()">বাতিল</button>
    </div>
  `;
  document.getElementById("modal-overlay").classList.add("show");
}

async function submitHost(id) {
  const url = document.getElementById("binary-url").value.trim();
  if (!url) { alert("লিংক দিন।"); return; }
  try {
    const res = await fetch(`${API_BASE}/apps/${id}/host-binary?binary_url=${encodeURIComponent(url)}`, {
      method: "POST",
      headers: { "x-admin-key": adminKey }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error ${res.status}`);
    }
    closeModal();
    await loadApps();
  } catch (e) { alert("ব্যর্থ হয়েছে: " + e.message); }
}

document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});
document.getElementById("admin-key-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
